version: 2

updates:
  # npm: one grouped weekly PR for minor/patch updates; majors arrive as separate PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used by .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in the Dockerfile (node, nginx-unprivileged)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
