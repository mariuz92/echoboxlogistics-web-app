# nginx configuration for the single-page app (see Dockerfile).

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- compression ---------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Orchestrator / load balancer health probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    include /etc/nginx/security-headers.inc;
    return 200 "ok\n";
  }

  # Runtime configuration generated at container start (never cached).
  location = /env-config.js {
    alias /tmp/env-config.js;
    default_type application/javascript;
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-store" always;
  }

  # Fingerprinted build output: cache for a year.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Entry points must always be revalidated so a new deploy is picked up.
  location = /index.html {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.json {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  # Single-page app: unknown paths are handled by the client-side router.
  location / {
    include /etc/nginx/security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}
